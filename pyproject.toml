[project]
name = "vortex-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
unisync = [
    "lestinxor",
]

[dependency-groups]
dev = [
    "lestinxor",
    "pytest>=9.0",
    "ruff==0.17.4",
]

[tool.ruff]
target-version = "py311"

[tool.uv.sources]
lestinxor = { git = "https://github.com/jonnysteedman683-wq/LESTINXOR-AGENT.git" }
